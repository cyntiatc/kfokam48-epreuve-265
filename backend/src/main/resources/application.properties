spring.application.name=kfokam48-backend
server.port=8080

# PostgreSQL du docker-compose.yml (port hote 5435 -> 5432 du conteneur)
spring.datasource.url=jdbc:postgresql://localhost:5435/kfokam48
spring.datasource.username=${DB_USERNAME:kfokam48}
spring.datasource.password=${DB_PASSWORD:kfokam48}

# Le schema est gere uniquement par Flyway (src/main/resources/db/migration)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Dates stockees et lues en UTC (ENF6)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
