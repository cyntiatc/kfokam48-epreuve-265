openapi: 3.0.3
info:
  title: KFOKAM48 - API Présences et Relectures
  version: 1.0.0
  description: |
    Contrat d'API imposé de l'épreuve KFOKAM48 (5 routes), complété par deux routes marquées comme
    extensions (hypothèse H3) : `GET /api/relectures` (ticket #10) et `POST /api/sessions/{id}/cloture` (ticket #12).
    Candidate : Tedjou Nguimzi Cyntia - Matricule 265.

    Toute erreur est renvoyée au format unique `Erreur` : `{ "code": "...", "message": "..." }`.
    Les règles de gestion (RG) et hypothèses (H) citées sont définies dans `docs/CAHIER_DES_CHARGES.md`.
servers:
  - url: http://localhost:8080
    description: Backend Spring Boot en local
# Aucune authentification en version 1 (H4).
security: []
tags:
  - name: Sessions
    description: Ouverture des sessions de cours par le formateur
  - name: Presences
    description: Marquage de la présence par code
  - name: Exercices
    description: Dépôt des exercices par les étudiants
  - name: Relectures
    description: Notation des exercices par les pairs
  - name: Tableau
    description: Tableau récapitulatif du formateur

paths:
  /api/sessions:
    post:
      tags: [Sessions]
      operationId: ouvrirSession
      summary: Ouvrir une session de cours et obtenir un code de présence
      description: |
        Crée une session au statut OUVERTE. Le code est valable 15 minutes à partir de l'ouverture (RG1).

        Erreurs (format `Erreur`) :
        - 400 REQUETE_INVALIDE : titre ou promotionId manquant ou incorrect, promotion inconnue (H2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreation'
      responses:
        '201':
          description: Session ouverte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                id: 12
                code: K7P2QX
                ouvertureAt: '2026-09-28T08:00:00Z'
                expirationAt: '2026-09-28T08:15:00Z'
        '400':
          $ref: '#/components/responses/Erreur'

  /api/sessions/{id}/cloture:
    post:
      tags: [Sessions]
      operationId: cloturerSession
      summary: Clôturer une session (extension H3)
      description: |
        Route complémentaire au contrat imposé (hypothèse H3, EF8). Irréversible :
        - le code de présence n'est plus accepté (410 CODE_EXPIRE, RG1) ;
        - les notes rendues deviennent définitives (exercices RELU -> DEFINITIF, RG9) ;
        - les exercices sans relecteur passent SANS_RELECTURE ;
        - les relectures encore en attente pourront être rendues une fois (H8).

        Erreurs (format `Erreur`) :
        - 400 REQUETE_INVALIDE : identifiant incorrect ou session inconnue (H2) ;
        - 409 SESSION_DEJA_CLOTUREE : la session est déjà clôturée.
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant de la session à clôturer
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Session clôturée, avec le bilan de la clôture
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCloturee'
              example:
                id: 12
                statut: CLOTUREE
                clotureAt: '2026-09-28T11:00:00Z'
                exercicesDefinitifs: 3
                exercicesSansRelecture: 1
                relecturesEnAttente: 2
        '400':
          $ref: '#/components/responses/Erreur'
        '409':
          $ref: '#/components/responses/Erreur'

  /api/presences:
    post:
      tags: [Presences]
      operationId: marquerPresence
      summary: Marquer sa présence avec le code de la session
      description: |
        Contrôles effectués dans cet ordre (H6) :
        1. le code correspond à une session, sinon 400 CODE_INCONNU ;
        2. l'étudiant existe et appartient à la promotion de la session, sinon 400 REQUETE_INVALIDE (H2, H9) ;
        3. l'étudiant n'est pas déjà présent, sinon 409 DEJA_PRESENT (RG3) ;
        4. le code n'est pas expiré et la session n'est pas clôturée, sinon 410 CODE_EXPIRE (RG1).

        Un champ manquant renvoie aussi 400 REQUETE_INVALIDE (H2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresenceCreation'
      responses:
        '201':
          description: Présence enregistrée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Presence'
              example:
                id: 340
                sessionId: 12
                etudiantId: 265
                source: CODE
        '400':
          $ref: '#/components/responses/Erreur'
        '409':
          $ref: '#/components/responses/Erreur'
        '410':
          $ref: '#/components/responses/Erreur'

  /api/exercices:
    post:
      tags: [Exercices]
      operationId: deposerExercice
      summary: Déposer le lien de son exercice pour une session
      description: |
        Un seul dépôt par étudiant et par session (RG4). Le système tente aussitôt d'attribuer un relecteur (RG8) :
        le statut renvoyé est EN_RELECTURE si un relecteur a été attribué, DEPOSE sinon.

        Erreurs (format `Erreur`) :
        - 400 LIEN_INVALIDE : le lien n'est pas une URL http ou https valide (RG5) ;
        - 400 REQUETE_INVALIDE : champ manquant, session ou étudiant inconnu (H2) ;
        - 409 EXERCICE_DEJA_DEPOSE : l'étudiant a déjà déposé un exercice pour cette session (RG4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciceDepot'
      responses:
        '201':
          description: Exercice déposé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciceDepose'
              example:
                id: 58
                statut: EN_RELECTURE
        '400':
          $ref: '#/components/responses/Erreur'
        '409':
          $ref: '#/components/responses/Erreur'

  /api/relectures:
    get:
      tags: [Relectures]
      operationId: listerRelecturesAttribuees
      summary: Lister les relectures attribuées à un relecteur (extension H3)
      description: |
        Route complémentaire au contrat imposé (hypothèse H3) : elle donne au relecteur l'identifiant
        de ses relectures et le lien des exercices à relire. Les relectures en attente viennent en premier,
        puis de la plus récente à la plus ancienne. L'auteur de l'exercice n'est pas communiqué.

        Erreurs (format `Erreur`) :
        - 400 REQUETE_INVALIDE : relecteurId manquant ou incorrect, ou étudiant inconnu (H2).
      parameters:
        - name: relecteurId
          in: query
          required: true
          description: Identifiant de l'étudiant relecteur
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Relectures attribuées au relecteur (liste vide s'il n'en a aucune)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RelectureAttribuee'
              example:
                - id: 7
                  sessionId: 12
                  sessionTitre: Spring Boot - API REST
                  lien: https://github.com/exemple/exercice-session-12
                  statut: EN_ATTENTE
                  note: null
                  commentaire: null
                  modifiable: true
        '400':
          $ref: '#/components/responses/Erreur'

  /api/relectures/{id}:
    post:
      tags: [Relectures]
      operationId: rendreRelecture
      summary: Rendre (ou modifier avant clôture) la relecture d'un exercice
      description: |
        Première soumission : la relecture passe à RENDUE.
        Nouvelle soumission : acceptée tant que la session est OUVERTE (décision Q10, RG9).

        Erreurs (format `Erreur`) :
        - 400 NOTE_INVALIDE : note absente, non entière ou hors de [0 ; 20] (RG6) ;
        - 400 REQUETE_INVALIDE : commentaire manquant ou relecture inconnue (H2) ;
        - 403 AUTO_RELECTURE : le relecteur est l'auteur de l'exercice (RG2) ;
        - 409 RELECTURE_DEJA_RENDUE : relecture déjà rendue et session clôturée, la note est définitive (RG9).
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant de la relecture attribuée
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelectureSoumission'
      responses:
        '200':
          description: Relecture enregistrée (première soumission, ou modification avant la clôture)
        '400':
          $ref: '#/components/responses/Erreur'
        '403':
          $ref: '#/components/responses/Erreur'
        '409':
          $ref: '#/components/responses/Erreur'

  /api/tableau:
    get:
      tags: [Tableau]
      operationId: consulterTableau
      summary: Consulter le tableau récapitulatif d'une promotion
      description: |
        Une ligne par étudiant de la promotion, y compris sans activité (calculs définis par RG11).

        Erreurs (format `Erreur`) :
        - 404 PROMOTION_INCONNUE : aucune promotion ne correspond à promotionId.
      parameters:
        - name: promotionId
          in: query
          required: true
          description: Identifiant de la promotion
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Tableau récapitulatif de la promotion
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LigneTableau'
              example:
                - etudiantId: 265
                  nom: Tedjou Nguimzi Cyntia
                  presences: 4
                  exercicesDeposes: 3
                  moyenne: 14.5
                  relecturesEnAttente: 1
                - etudiantId: 266
                  nom: Exemple Etudiant
                  presences: 1
                  exercicesDeposes: 0
                  moyenne: null
                  relecturesEnAttente: 0
        '404':
          $ref: '#/components/responses/Erreur'

components:
  responses:
    Erreur:
      description: Erreur au format unique Erreur (RG12). Le code précis de chaque cas est indiqué dans la description de l'opération.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erreur'
          example:
            code: CODE_EXPIRE
            message: Ce code de présence a expiré.

  schemas:
    Erreur:
      type: object
      description: |
        Format d'erreur unique de l'API (RG12). Codes utilisés : REQUETE_INVALIDE, CODE_INCONNU, DEJA_PRESENT,
        CODE_EXPIRE, LIEN_INVALIDE, EXERCICE_DEJA_DEPOSE, NOTE_INVALIDE, AUTO_RELECTURE,
        RELECTURE_DEJA_RENDUE, PROMOTION_INCONNUE.
      required: [code, message]
      properties:
        code:
          type: string
          description: Code d'erreur métier stable, exploitable par le frontend
          example: CODE_EXPIRE
        message:
          type: string
          description: Message lisible en français, destiné à l'utilisateur
          example: Ce code de présence a expiré.

    SessionCreation:
      type: object
      required: [titre, promotionId]
      properties:
        titre:
          type: string
          minLength: 1
          maxLength: 150
          example: Spring Boot - API REST
        promotionId:
          type: integer
          format: int64
          example: 3

    Session:
      type: object
      required: [id, code, ouvertureAt, expirationAt]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
          pattern: '^[A-Z0-9]{6}$'
          description: Code de présence unique (RG10)
        ouvertureAt:
          type: string
          format: date-time
        expirationAt:
          type: string
          format: date-time
          description: ouvertureAt + 15 minutes (RG1)

    SessionCloturee:
      type: object
      description: Bilan de la clôture d'une session (extension H3).
      required: [id, statut, clotureAt, exercicesDefinitifs, exercicesSansRelecture, relecturesEnAttente]
      properties:
        id:
          type: integer
          format: int64
        statut:
          type: string
          enum: [CLOTUREE]
        clotureAt:
          type: string
          format: date-time
        exercicesDefinitifs:
          type: integer
          minimum: 0
          description: Exercices relus dont la note vient de devenir définitive
        exercicesSansRelecture:
          type: integer
          minimum: 0
          description: Exercices restés sans relecteur
        relecturesEnAttente:
          type: integer
          minimum: 0
          description: Relectures non rendues, qui pourront encore l'être une fois (H8)

    PresenceCreation:
      type: object
      required: [code, etudiantId]
      properties:
        code:
          type: string
          minLength: 1
          description: Code saisi par l'étudiant, insensible à la casse (RG10)
          example: K7P2QX
        etudiantId:
          type: integer
          format: int64
          example: 265

    Presence:
      type: object
      required: [id, sessionId, etudiantId, source]
      properties:
        id:
          type: integer
          format: int64
        sessionId:
          type: integer
          format: int64
        etudiantId:
          type: integer
          format: int64
        source:
          type: string
          enum: [CODE]
          description: Origine de la présence. Seule valeur en version 1 - CODE, saisie du code par l'étudiant (H1).

    ExerciceDepot:
      type: object
      required: [sessionId, etudiantId, lien]
      properties:
        sessionId:
          type: integer
          format: int64
          example: 12
        etudiantId:
          type: integer
          format: int64
          example: 265
        lien:
          type: string
          maxLength: 2048
          description: URL absolue http ou https (RG5), sinon 400 LIEN_INVALIDE
          example: https://github.com/exemple/exercice-session-12

    ExerciceDepose:
      type: object
      required: [id, statut]
      properties:
        id:
          type: integer
          format: int64
        statut:
          $ref: '#/components/schemas/StatutExercice'

    StatutExercice:
      type: string
      description: Cycle de vie d'un exercice (diagramme D4)
      enum: [DEPOSE, EN_RELECTURE, RELU, DEFINITIF, SANS_RELECTURE]

    RelectureAttribuee:
      type: object
      description: Relecture attribuée à un relecteur (extension H3).
      required: [id, sessionId, sessionTitre, lien, statut, note, commentaire, modifiable]
      properties:
        id:
          type: integer
          format: int64
          description: Identifiant à utiliser dans POST /api/relectures/{id}
        sessionId:
          type: integer
          format: int64
        sessionTitre:
          type: string
        lien:
          type: string
          description: Lien de l'exercice à relire (URL http ou https, RG5)
        statut:
          type: string
          enum: [EN_ATTENTE, RENDUE]
        note:
          type: integer
          nullable: true
          minimum: 0
          maximum: 20
          description: Note rendue, null tant que la relecture est en attente
        commentaire:
          type: string
          nullable: true
        modifiable:
          type: boolean
          description: |
            Vrai si la relecture peut encore être envoyée : en attente (y compris après la clôture, H8),
            ou rendue dans une session encore ouverte (décision Q10, RG9).

    RelectureSoumission:
      type: object
      required: [note, commentaire]
      properties:
        note:
          type: integer
          minimum: 0
          maximum: 20
          description: Note entière de 0 à 20 (RG6), sinon 400 NOTE_INVALIDE
          example: 15
        commentaire:
          type: string
          minLength: 1
          maxLength: 1000
          example: Code clair et bien structuré. Il manque la gestion des erreurs.

    LigneTableau:
      type: object
      required: [etudiantId, nom, presences, exercicesDeposes, moyenne, relecturesEnAttente]
      properties:
        etudiantId:
          type: integer
          format: int64
        nom:
          type: string
        presences:
          type: integer
          minimum: 0
          description: Nombre de sessions de la promotion où l'étudiant est présent
        exercicesDeposes:
          type: integer
          minimum: 0
          description: Nombre d'exercices déposés par l'étudiant
        moyenne:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 20
          description: Moyenne des notes reçues, arrondie à 2 décimales, null si aucune note (RG11, H7)
        relecturesEnAttente:
          type: integer
          minimum: 0
          description: Relectures attribuées à l'étudiant et non encore rendues
