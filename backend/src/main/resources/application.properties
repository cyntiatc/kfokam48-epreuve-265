spring.application.name=kfokam48-backend
server.port=8080

# PostgreSQL du docker-compose.yml (port hote 5435 -> 5432 du conteneur)
spring.datasource.url=jdbc:postgresql://localhost:5435/kfokam48
spring.datasource.username=${DB_USERNAME:kfokam48}
spring.datasource.password=${DB_PASSWORD:kfokam48}

# Le schema est gere uniquement par Flyway (src/main/resources/db/migration)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Origines autorisees a appeler l'API directement (CORS, ENF5), separees par des virgules
app.cors.origines-autorisees=http://localhost:5173,http://127.0.0.1:5173

# Dates stockees et lues en UTC (ENF6)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Documentation interactive (ticket #16) : http://localhost:8080/swagger-ui.html
# Swagger UI affiche le contrat lui-meme (api/contrat.yaml, source de verite, ENF1), pas une description generee.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/docs/contrat.yaml
# Valeurs par defaut rendues explicites : Swagger UI lit sa configuration a /v3/api-docs/swagger-config,
# et la description generee a /v3/api-docs se limite aux controleurs de l'application.
springdoc.api-docs.path=/v3/api-docs
springdoc.packages-to-scan=com.kfokam48.epreuve
